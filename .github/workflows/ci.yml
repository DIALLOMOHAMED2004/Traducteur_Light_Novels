name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  ci:
    name: Django et Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: python -m pip install -r requirements.lock

      - name: Vérifier les dépendances
        run: python -m pip check

      - name: Vérifier la configuration Django
        run: python manage.py check --settings=Tsukiyomi_project.test_settings

      - name: Exécuter les tests
        run: python manage.py test --settings=Tsukiyomi_project.test_settings --noinput --buffer

      - name: Vérifier les migrations sans les modifier
        run: python manage.py makemigrations --check --dry-run --settings=Tsukiyomi_project.test_settings

      - name: Construire l'image Docker
        run: docker build -t tsukiyomi:ci .
