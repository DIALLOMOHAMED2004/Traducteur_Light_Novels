services:
  web:
    build: .
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Définir POSTGRES_DB dans .env}
      POSTGRES_USER: ${POSTGRES_USER:?Définir POSTGRES_USER dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media:/app/media_upload
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Définir POSTGRES_DB dans .env}
      POSTGRES_USER: ${POSTGRES_USER:?Définir POSTGRES_USER dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  media:
  postgres:
